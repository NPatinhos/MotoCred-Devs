<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoCred - Formulário</title>

    <link rel="stylesheet" href="public/tailwind.css" />
    <!-- CSS gerado pelo Tailwind -->
    <!-- <link rel="stylesheet" href="src/styles.css">        estilos gerais do projeto -->
  </head>

  <body class="bg-[#D9D9D9] flex justify-center items-start p-8">
    <div
      id="quadro_branco"
      class="bg-white rounded-2xl w-full max-w-2xl flex flex-col items-center justify-start p-6 space-y-6"
    >
      <header class="flex flex-col items-center space-y-3 w-80 h-auto">
        <img
          class="img_logo"
          src="imagens/motocred_logo.avif"
          alt="Logo MotoCred"
        />
        <h3 id="titulo_pagina" class="text-[#F2600B] font-medium text-2xl">
          Formulário de Financiamento
        </h3>
      </header>

      <!-- PPA -->
      <section>
        <p>teste</p>
      </section>

      <!-- NEGADO -->
      <section class="hidden"></section>

      <!-- SIMULAÇÃO -->
      <section class="hidden"></section>

      <!-- ETAPAS COM BARRA DE NAVEGAÇÃO -->
      <section>
        <nav>
          <!-- BARRA DE NAVEGAÇÃO -->
        </nav>

        <!-- DADOS CLIENTE -->
        <section class="hidden"></section>

        <!-- DOCUMENTAÇÃO -->
        <section class="hidden"></section>

        <!-- REFERÊNCIAS -->
        <section class="hidden"></section>

        <!-- VERIFIQUE SEUS DADOS -->
        <section class="hidden"></section>

        <!-- DADOS ENVIADOS -->
        <section class="hidden"></section>
      </section>
      <!-- BOTOES NAVEGAÇÃO -->
      <div class="form-navigation final-nav v2-w-full">
        <button
          type="button"
          class="btn-secondary nav-prev"
          aria-label="Voltar para a etapa anterior"
          disabled
        >
          Voltar
        </button>
        <button
          type="button"
          class="btn-primary nav-next"
          aria-label="Avançar para a próxima etapa"
        >
          Próximo
        </button>
      </div>
      <footer>
        <p class="text-black/50 text-xs">
          © 2025 MotoCred. Todos os direitos reservados.
        </p>
      </footer>
    </div>

</html>
